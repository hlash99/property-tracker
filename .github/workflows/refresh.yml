name: refresh

# Twice-weekly server-side refresh: pulls ~10 yrs of sold comps (realtor.com via HomeHarvest +
# Redfin's sold export), Zillow ZHVI, FRED CPI/HICP/FX, imovirtual listings and INE (Lisbon; read from seed/ine.json, which the
# Mac's weekly com.hassanlashkari.ine-seed job refreshes because INE refuses GitHub's runners), refits the local
# models and rewrites data.json. Street addresses/coordinates come from the SUBJECTS_JSON
# secret; the sales cache (which holds coordinates) lives in the Actions cache, never the repo.
on:
  schedule:
    - cron: '17 14 * * 1,4'   # Mon + Thu 14:17 UTC (~07:17 PT)
  workflow_dispatch: {}        # also lets the dashboard ↻ button trigger it

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore sales cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: sales-${{ github.run_id }}
          restore-keys: sales-
      - name: Install
        run: pip install -q homeharvest requests numpy pandas
      - name: Rebuild data.json
        env:
          SUBJECTS_JSON: ${{ secrets.SUBJECTS_JSON }}
        run: python scripts/refresh.py
      - name: Save sales cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: sales-${{ github.run_id }}
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data.json; then
            git add data.json
            git commit -m "refresh: comps + indices $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git push && exit 0
              git pull --rebase origin main || { git rebase --abort || true; exit 0; }
            done
          else
            echo "no change"
          fi
